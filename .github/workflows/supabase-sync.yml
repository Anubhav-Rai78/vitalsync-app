name: Supabase Full Automated Sync

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Project link state is committed via supabase/.temp/ — no supabase link step needed.
      # The SUPABASE_ACCESS_TOKEN authenticates the management API;
      # --password verifies direct Postgres connectivity.

      - name: Push Database Migrations
        run: |
          supabase db push --include-all --linked --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}